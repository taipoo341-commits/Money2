name: Update DGPA closure data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update_dgpa.yml"
      - "scripts/update_dgpa.py"
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write
  pages: write

concurrency:
  group: update-dgpa-closure-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python scripts/update_dgpa.py
      - name: Commit updated public data
        id: commit
        run: |
          if git diff --quiet -- data/dgpa_closures.json; then
            echo "No data change"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dgpa_closures.json
          git commit -m "chore: update DGPA closure data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Publish updated data to GitHub Pages
        if: steps.commit.outputs.changed == 'true' || github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
